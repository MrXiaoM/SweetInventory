title: '界面标题 %page%/%max_page%'
inventory:
  - '框框框框框框框框框'
  - '上页页页页页页页下'
  - '框框框框框框框框框'
page-guide:
  # 分页内容应该放在上述布局的哪些字符上
  slot: 页
  # 每一页的布局，翻页时会按顺序将以下字符替换掉上述布局的字符，再应用图标
  # 列表中每一个元素 (以 - 开头) 代表一页
  pages:
    - '一二一二一二一'
    - '二一二一二一二'

items:
  方框:
    # 这个图标应该在布局的哪里
    slots: [ 框, 上, 下 ]
    priority: 10
    material: WHITE_STAINED_GLASS_PANE
    display: '&f方框'
  上一页:
    slot: 上
    material: LIME_STAINED_GLASS_PANE
    display: '&e上一页'
    view-requirement: page has-prev-page
    left-click-commands: ['[prev]']
  下一页:
    slot: 下
    material: LIME_STAINED_GLASS_PANE
    display: '&e下一页'
    view-requirement: page has-next-page
    left-click-commands: ['[next]']

  按钮1:
    slot: 一
    material: GRASS_BLOCK
    display: '&f按钮'
    lore:
      - ''
      - '&a左键 &7| &f回城'
      - '&b右键 &7| &f回满血(雾'
    left-click-commands:
      - '[player]spawn'
    right-click-commands:
      - '[console]kill %player_name%'
  按钮2:
    slot: 二
    material: STONE
    display: '&f收购石头'
    lore:
      - ''
      - '&a左键&7 | &f出售32个石头，获得10金币'
      - '&b右键&7 | &f出售64个石头，获得20金币'
    take-item-actions:
      - type: take-item
        item:
          count: ${vars.amount}
          matcher:
            material: STONE
        deny-commands:
          - '[message]你没有足够的石头'
      - console: 'money give %player_name% ${vars.money}'
      - message: '<green>你出售了 <yellow>${vars.amount}</yellow> 个石头，获得 <yellow>${vars.money}</yellow> 金币'
    left-click-commands:
      - set-vars:
          key: amount
          value: 32
      - set-vars:
          key: money
          value: 10
      - ref: take-item-actions
    right-click-commands:
      - set-vars:
          key: amount
          value: 64
      - set-vars:
          key: money
          value: 20
      - ref: take-item-actions
